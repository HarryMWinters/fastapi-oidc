version: "3"

dotenv: [".env"]

tasks:

  ci:
    desc: "Run code analyzers from pre-commit and unit tests"
    deps: [install-poetry, create-virtual-env]
    cmds:
      - task: unit
      - task: lint

  lint:
    desc: "Install and init pre-commits."
    deps: [install-poetry, create-virtual-env]
    cmds:
      - poetry run pre-commit run --all-files

  unit:
    desc: "Run unit tests"
    deps: [install-poetry, create-virtual-env]
    cmds:
      - poetry run pytest
    silent: true

  install-poetry:
    desc: "Install poetry package manager."
    cmds:
      - pip install poetry
    status:
      - poetry --version
    generates:
      - $HOME/.poetry/env

  create-virtual-env:
    desc: "Create poetry virtual env."
    deps: [install-poetry]
    cmds:
      - poetry install

  build:
    desc: "Build python package for publication."
    deps: [install-poetry]
    cmds:
      - poetry build
    sources:
      - fastapi_oidc/**
      - poetry.lock
      - pyproject.toml
    generates:
      - dist/**

  publish:
    desc: "Publish to PyPI. Prefer the Release GitHub workflow (trusted publishing); this needs a PyPI API token in PYPI_TOKEN."
    deps: [build]
    cmds:
      - poetry publish --username __token__ --password "$PYPI_TOKEN"

  clean:
    desc: "Remove artifacts and caches."
    cmds:
      - rm -rf ./build ./dist ./*.egg-info __pycache__

  init-pre-commit-ci:
    desc: "Init pre-commit."
    deps: [install-pre-commit-ci]
    cmds:
      - python3 pre-commit-2.8.2.pyz install
    generates:
    - .git/hooks/pre-commit

  build_docs:
    desc: "Build sphinx docs in /docs"
    deps: [create-virtual-env]
    cmds:
      - |
        cd docs &&
        source $HOME/.poetry/env && poetry run make html
